<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>CelinesChat</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="login-screen" class="screen">
    <form id="login-form" class="login-card">
      <img class="c4t-logo c4t-logo-blue login-logo" src="/c4t-logo-blau.png" alt="C4T">
      <img class="c4t-logo c4t-logo-purple login-logo" src="/c4t-logo-lila.png" alt="C4T">
      <h1>CelinesChat</h1>
      <p>Enter the code or password shown in the plugin's settings.</p>
      <input id="login-code" type="password" autocomplete="current-password" maxlength="100" autofocus>
      <button type="submit">Connect</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <div id="chat-screen" class="screen" hidden>
    <header id="chat-header">
      <img class="c4t-logo c4t-logo-blue" src="/c4t-logo-blau.png" alt="C4T">
      <img class="c4t-logo c4t-logo-purple" src="/c4t-logo-lila.png" alt="C4T">
      <div id="tab-strip" class="picker"></div>
      <button id="channel-button" type="button" class="channel-button">
        <span id="channel-label">...</span>
      </button>
      <button id="bookmarks-button" type="button" class="theme-button" title="Bookmarks" aria-label="Bookmarks">&#128278;</button>
      <button id="search-button" type="button" class="theme-button" title="Search" aria-label="Search">&#128269;</button>
      <button id="theme-button" type="button" class="theme-button" title="Design" aria-label="Design">&#127912;</button>
      <span id="connection-dot" class="dot" title="Connection status"></span>
    </header>

    <div id="search-bar" hidden>
      <input id="search-input" type="search" placeholder="Search messages..." autocomplete="off">
      <span id="search-count"></span>
    </div>

    <main id="message-list" aria-live="polite"></main>

    <div id="send-error" class="error-banner" hidden></div>

    <form id="compose-form">
      <textarea id="compose-text" rows="1" placeholder="Message..." maxlength="4000"></textarea>
      <button type="submit">Send</button>
    </form>
  </div>

  <div id="channel-sheet" class="sheet-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Change channel">
      <div class="sheet-header">
        <h2>Change channel</h2>
        <button id="sheet-close" type="button" class="sheet-close" aria-label="Close">&times;</button>
      </div>
      <div id="sheet-content" class="sheet-content"></div>
    </div>
  </div>

  <div id="theme-sheet" class="sheet-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Design">
      <div class="sheet-header">
        <h2>Design</h2>
        <button id="theme-sheet-close" type="button" class="sheet-close" aria-label="Close">&times;</button>
      </div>
      <div id="theme-sheet-content" class="sheet-content"></div>
    </div>
  </div>

  <div id="action-sheet" class="sheet-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-header">
        <h2 id="action-sheet-title"></h2>
        <button id="action-sheet-close" type="button" class="sheet-close" aria-label="Close">&times;</button>
      </div>
      <div id="action-sheet-content" class="sheet-content"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
